[flake8]
max-line-length = 110
max-doc-length = 79
# E201/E221/E241/E272 are alignment whitespace: the DOF group table, the arrow vertex
# coordinates and the aligned unit comments are all read as columns.
# E741: O and C are the OCS/CCS split in the intrinsic decomposition, not stand-ins for
# 0 and 1, so the one-letter names carry the physics.
ignore = E133, E226, E228, E201, E221, E241, E272, E741, N802, N803, N806, N812,
  N813, N815, N816, W503
exclude =
  bin,
  doc/conf.py,
  **/*/__init__.py,
  **/*/version.py,
  tests/.tests
